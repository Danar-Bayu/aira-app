      // Pastikan base path sesuai dengan subpath GitHub Pages (misal: "/aira-app/")
      const basePath = "/aira-app/"; // Sesuaikan dengan repo Anda!
      
      // Redirect ke rute asal setelah index.html selesai dimuat
      if (sessionStorage.redirect) {

        history.replaceState(null, null, redirect);
